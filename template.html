<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact Advisor</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a303c;
  --text:#e6e9ef; --muted:#9aa4b2; --accent:#6ea8fe;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --keep:#60a5fa; --lvl:#c084fc;
  --r5:#f4c86a; --r4:#c084fc; --r3:#60a5fa; --r2:#4ade80; --r1:#9aa4b2;
}
*{box-sizing:border-box}
html{margin:0;height:100%}
body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.96);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.tabs{display:flex;gap:4px}
.tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit}
.tab:hover{color:var(--text);background:var(--panel)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--text)}
.importOverlay{position:fixed;inset:0;z-index:120;background:rgba(5,7,10,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.importCard{width:min(540px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.importCard h3{margin:0 0 12px;font-size:16px}
.progressTrack{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progressFill{height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .15s}
.importActions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.importNote{margin-top:10px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12px;line-height:1.45;color:var(--muted)}
.importNote b{color:var(--text)}
.importNote a{color:var(--accent)}
.bootEmpty{max-width:560px;margin:8vh auto 0;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center}
.bootEmpty h2{margin:0 0 8px;font-size:20px}
.bootEmpty p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.bootEmpty .btn{padding:8px 16px}
.headerRight{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-left:auto;flex-wrap:nowrap;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0;flex:1 1 auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip b{color:var(--text)}
main{padding:14px 16px 40px}
.hide{display:none!important}
.split{display:grid;grid-template-columns:var(--left-w,270px) 12px minmax(0,1fr);gap:0;align-items:stretch}
.split > *{min-width:0}
body.chars-active{overflow:hidden}
body.chars-active main{height:calc(100vh - var(--header-h,64px));overflow:hidden;padding-bottom:14px}
body.chars-active #tab-chars{height:100%}
body.chars-active .split{height:100%;grid-template-rows:100%}
body.chars-active .leftcol{height:100%}
body.chars-active .rightcol{height:100%;overflow:hidden}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.leftcol{position:relative;min-height:0;display:flex;flex-direction:column;gap:8px}
.leftcol .list{position:static;top:auto;max-height:none;flex:1 1 auto;min-height:0}
.identityCard,.weaponSide{padding:10px;flex:0 0 auto}
.idName{font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idSub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idTags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;min-width:0}
.idTag{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;padding:2px 7px 2px 4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;line-height:1.2;white-space:nowrap}
.idTag img{display:block;width:14px;height:14px;flex:0 0 auto;object-fit:contain}
.idTag span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.identityCard .scorebox{margin:8px 0 0;text-align:left;width:100%}
.scoreTop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.scoreCopy{min-width:0}
.rarityStars{display:block;height:12px;width:auto;max-width:100%;flex:0 0 auto;opacity:.95}
.identityCard .scorebar{width:100%}
.sideTitle{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.weaponSide .weaponPick{flex:1 1 auto}
.weaponStatus{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weaponSideStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.weaponSideStats>div{display:flex;flex-direction:column;gap:1px;font-size:11px;color:var(--muted);min-width:0}
.weaponSideStats span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weaponSideStats b{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
.colResize{position:relative;cursor:ew-resize;touch-action:none;z-index:4;height:100%;align-self:stretch}
.colResize::before{content:'';position:absolute;left:50%;top:40px;bottom:40px;width:1px;background:var(--line);transform:translateX(-50%)}
.colResize:hover::before{width:3px;background:var(--accent)}
body.resizing,body.resizing *{cursor:ew-resize!important;user-select:none!important}
.list{overflow:hidden;padding:6px;display:flex;flex-direction:column}
.listtools{flex:0 0 auto}
.importrow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.importrow .btn{flex:1 1 auto;white-space:nowrap}
.importBtn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:6px 8px;line-height:1}
.importBtn svg{flex:0 0 auto}
.sortchips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.sortchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--muted);font:inherit;font-size:10px;padding:3px 7px;cursor:pointer;white-space:nowrap}
.sortchip:hover{color:var(--text)}
.sortchip.on{color:var(--text);background:#233049;border-color:#35507d}
.listmodeBar{display:flex;align-items:center;gap:6px;width:100%;height:22px;padding:0 8px;margin:0 0 4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--muted);font:inherit;font-size:10px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;flex:0 0 auto;transition:color .16s ease,background .16s ease,border-color .16s ease}
.listmodeBar:hover{color:var(--text);background:#1f2530;border-color:#35507d}
.listmodeBar.on{color:var(--text)}
.listmodeBar .barLabel{flex:1 1 auto;text-align:left}
.listmodeBar .barChevron{width:22px;height:12px;flex:0 0 auto;transition:transform .24s cubic-bezier(.4,0,.2,1)}
.listmodeBar.filters .barChevron{transform:rotate(180deg)}
.listmodeView{position:relative;width:100%;height:30px;overflow:hidden;transition:height .24s cubic-bezier(.4,0,.2,1)}
.listmodeView.noanim{transition:none!important}
.modePane{position:absolute;inset:0;transition:opacity .18s ease,transform .24s cubic-bezier(.4,0,.2,1);will-change:transform,opacity}
.searchPane{transform:translateY(0);opacity:1}
.filterPane{transform:translateY(-100%);opacity:0;pointer-events:none}
.listmodeView.filters .searchPane{transform:translateY(-100%);opacity:0;pointer-events:none}
.listmodeView.filters .filterPane{transform:translateY(0);opacity:1;pointer-events:auto}
.searchPane input{width:100%;height:30px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 9px;margin:0;font:inherit}
.filterMenu{position:relative;min-height:18px}
.filterRows{display:flex;flex-direction:column;gap:2px;margin:0;padding-right:22px}
.filterRow{display:flex;align-items:center;gap:0;flex-wrap:wrap;min-height:18px;flex:0 0 auto;max-width:100%;min-width:0}
.filterIcon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;opacity:.72;transition:opacity .12s,background .12s,border-color .12s}
.filterIcon:hover{opacity:1;background:var(--panel2)}
.filterIcon.on{opacity:1;background:#233049;border-color:#35507d}
.filterIcon img{display:block;width:16px;height:16px;object-fit:contain}
.filterClearAll{position:absolute;top:0;right:0;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:9px;line-height:1;cursor:pointer;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,color .16s ease,background .16s ease}
.filterClearAll.show{opacity:1;visibility:visible;pointer-events:auto}
.filterClearAll:hover{color:var(--text);background:var(--panel2)}
.listbody{flex:1 1 auto;overflow:auto;min-height:0;overscroll-behavior:contain}
.crow{padding:7px 9px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.crow:hover{background:var(--panel2)}
.crow.on{background:#233049;outline:1px solid #35507d}
.crow > div:first-child{min-width:0}
.crow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .score{flex:0 0 auto}
.score{font-variant-numeric:tabular-nums;font-size:12px;color:var(--accent)}
.rightcol{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.subtabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.subtab{background:transparent;border:1px solid transparent;color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
.subtab:hover{color:var(--text);background:var(--panel2)}
.subtab.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
.subpane{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px}
.dhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:nowrap;margin-bottom:10px;min-width:0}
.dhead-main{min-width:0;flex:1 1 auto}
.dhead h2{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metaline{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorebox{flex:0 0 auto;margin-left:auto;text-align:right}
.muted{color:var(--muted)}
.small{font-size:12px}
.helpq{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border:1px solid var(--line);border-radius:50%;font-size:10px;line-height:1;color:var(--muted);cursor:help;margin-left:4px;vertical-align:middle;position:relative;text-transform:none;letter-spacing:0}
.helpq:hover,.helpq:focus{color:var(--text);border-color:var(--muted);outline:none}
.helpTip{position:fixed;z-index:220;display:none;max-width:min(340px,calc(100vw - 24px));max-height:min(60vh,320px);overflow:auto;overscroll-behavior:contain;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 16px 36px rgba(0,0,0,.55);color:var(--text);font-size:11px;font-weight:400;line-height:1.35;white-space:normal;pointer-events:none}
.helpTip.show{display:block}
select,input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;font:inherit}
.buildbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 14px;min-width:0}
.buildbar select{flex:1 1 240px;min-width:0;max-width:100%}
.trialNote{font-size:11px;color:var(--muted);margin:-6px 0 10px}
.weaponPick{position:relative;flex:1 1 260px;min-width:0}
.weaponBtn{display:flex;align-items:center;gap:8px;width:100%;min-width:0;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;cursor:pointer;text-align:left}
.weaponBtn .wname{flex:1 1 auto;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.weaponBtn .wmeta{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--muted);white-space:nowrap;margin-left:auto}
.weaponBtn .caret{font-size:10px;color:var(--muted);flex:0 0 auto}
.weaponMenu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 36px rgba(0,0,0,.5);max-height:min(62vh,440px);overflow:auto;overscroll-behavior:contain;padding:4px}
.weaponSection{padding:3px 2px}
.weaponSection + .weaponSection{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.weaponSectionLabel{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:3px 6px 2px}
.weaponItem{display:flex;align-items:center;gap:7px;width:100%;overflow:hidden;background:transparent;border:0;border-radius:7px;padding:5px 6px;font:inherit;cursor:pointer;text-align:left;min-width:0}
.weaponItem:hover,.weaponItem.on{background:var(--panel2)}
.weaponItem .wname{flex:1 1 auto;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.weaponItem .wmeta{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--muted);white-space:nowrap;margin-left:auto}
.wbadges{display:inline-flex;align-items:center;gap:4px;flex:0 100 auto;min-width:0;overflow:hidden;white-space:nowrap}
.weaponItem .wbadge,.weaponBtn .wbadge{font-size:9px;line-height:1.5;border:1px solid currentColor;border-radius:999px;padding:0 5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;flex:0 0 auto}
.weaponItem.none,.weaponBtn.r0{color:var(--muted)}
.weaponItem.r1,.weaponBtn.r1{color:var(--r1)}
.weaponItem.r2,.weaponBtn.r2{color:var(--r2)}
.weaponItem.r3,.weaponBtn.r3{color:var(--r3)}
.weaponItem.r4,.weaponBtn.r4{color:var(--r4)}
.weaponItem.r5,.weaponBtn.r5{color:var(--r5)}
.slotpicks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin:8px 0 12px}
.slotpick{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.slotpick select{width:100%;text-transform:none;letter-spacing:0}
.buildchips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px;min-width:0}
.buildchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--muted);font:inherit;font-size:11px;padding:4px 9px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buildchip:hover{color:var(--text)}
.buildchip.on{color:var(--text);background:#233049;border-color:#35507d}
.loadoutBlock{background:rgba(23,26,33,.55);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0 12px;min-width:0}
.loadoutHead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.loadoutHead h3{margin:0;font-size:14px}
.loadoutActions{display:flex;align-items:center;gap:6px}
.btn.slim{padding:4px 8px;font-size:11px}
.artifactSlots{margin:6px 0 10px;min-width:0}
.loadoutU{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:124px;gap:8px;max-width:780px;margin:0 auto}
.slotStats{min-width:0;height:100%;background:rgba(23,26,33,.5);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.slotStats.sel{border-color:#35507d;background:#1b2433}
.slotStats .artifactStatCard{height:100%;align-content:stretch}
.slotCluster{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;padding:2px 0;background:transparent;border:0;--circle-size:56px}
.slotClusterRow{display:flex;align-items:center;justify-content:center;gap:2px;min-width:0}
@media(max-width:600px){.loadoutU{grid-auto-rows:112px}.slotCluster{--circle-size:39px}.slotClusterRow{gap:1px}}
@media(max-width:410px){.slotCluster{--circle-size:36px}}
@media(min-width:1000px){.loadoutU{grid-auto-rows:160px}.slotCluster{--circle-size:72px}}
.artifactStatCard{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;column-gap:8px;row-gap:2px;width:100%;min-width:0;height:100%;align-content:stretch;font-size:10px;color:var(--muted)}
.artifactStatCard.empty{grid-template-columns:1fr;gap:2px}
.artStatName{grid-column:1;grid-row:1;display:flex;justify-content:space-between;gap:4px;color:var(--text);font-weight:600;font-size:12px;white-space:nowrap;min-width:0}
.artNameText{overflow:hidden;text-overflow:ellipsis;min-width:0}
.artNameScore{flex:0 0 auto;color:var(--accent);font-variant-numeric:tabular-nums}
.artStatMain{grid-column:2;grid-row:1;display:flex;align-items:baseline;justify-content:flex-end;gap:3px;min-width:0;overflow:hidden;color:var(--text);font-size:12px;white-space:nowrap}
.artMainLabel{flex:0 0 auto}
.artMainVal{flex:0 0 auto;font-weight:600}
.artMainDelta{flex:0 0 auto;font-size:10px;font-weight:600}
.artStatSubs{grid-column:1 / -1;grid-row:2;display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;gap:2px;text-align:left;min-width:0;align-self:stretch;align-items:center;margin-top:2px}
.artSub{display:flex;justify-content:space-between;align-items:center;gap:4px;min-width:0;white-space:nowrap;font-size:12px;line-height:1.45}
.artSubName{display:flex;align-items:baseline;gap:4px;min-width:0;overflow:hidden}
.artSubCurName{overflow:hidden;text-overflow:ellipsis;min-width:0}
.artSubVals{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;flex:0 0 auto;min-width:0;white-space:nowrap}
.artSubVal{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.artSubDelta{flex:0 0 auto;font-size:10px;font-weight:600}
.artSubOtherName,.artSubOtherVal{flex:0 0 auto;text-decoration:line-through;color:var(--muted);opacity:.8}
.artMainVal.up,.artSubVal.up,.artMainDelta.up,.artSubDelta.up{color:var(--good)}
.artMainVal.down,.artSubVal.down,.artMainDelta.down,.artSubDelta.down{color:var(--bad)}
.hiddenSub,.hiddenSub .artSubCurName,.hiddenSub .artSubVal{color:var(--warn)}
.artStatOn{grid-column:1 / -1;grid-row:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;margin-top:1px}
.artifactStatCard.empty .artStatName{grid-column:1;grid-row:1}
.circleSlotWrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;animation:slotIn .28s both;animation-delay:var(--slot-delay,0ms)}
.circleEquipToggle{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:10px;line-height:1;cursor:pointer;z-index:2;padding:0}
.circleEquipToggle:hover{color:var(--text);background:var(--panel2)}
.circleEquipToggle.on{color:var(--accent);border-color:#35507d;background:#233049}
.circleSlot{position:relative;width:var(--circle-size,38px);height:var(--circle-size,38px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#2b3445,#171a21 70%);border:2px solid var(--line);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;flex:0 0 auto}
.circleSlot:hover{transform:scale(1.04)}
.circleSlot.r5{border-color:rgba(244,200,106,.55)}
.circleSlot.r4{border-color:rgba(192,132,252,.5)}
.circleSlot.r3{border-color:rgba(96,165,250,.45)}
.circleSlot.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.28)}
.circleSlot.dragOver,.slotStats.dragOver{box-shadow:0 0 0 4px rgba(110,168,254,.35);transform:scale(1.02)}
.circleSlot.empty{opacity:.65}
.circleGlyph{font-size:calc(var(--circle-size,38px) * 0.42);color:var(--text);text-shadow:0 1px 4px rgba(0,0,0,.5)}
.circleSlot.r5 .circleGlyph{color:var(--r5)}
.circleSlot.r4 .circleGlyph{color:var(--r4)}
.circleSlot.r3 .circleGlyph{color:var(--r3)}
.circleLevel{position:absolute;right:-2px;bottom:-2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 4px;font-size:8px;color:var(--muted);line-height:1.5;white-space:nowrap}
.circleRolls{position:absolute;left:-2px;bottom:-2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 4px;font-size:8px;color:var(--accent);line-height:1.5;white-space:nowrap}
.artifactSlots.noEnter .circleSlotWrap{animation:none}

@keyframes slotIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

.artifactPicker{margin-top:8px;background:rgba(23,26,33,.45);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}

.pickerItem:hover{transform:scale(1.05)}
.pickerItem.r5{border-color:rgba(244,200,106,.5)}
.pickerItem.r4{border-color:rgba(192,132,252,.45)}
.pickerItem.r3{border-color:rgba(96,165,250,.4)}
.pickerItem.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.28)}
.pickerItem.current::after{content:'';position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(110,168,254,.5);pointer-events:none}
.pickerGlyph{font-size:20px;color:var(--text)}
.pickerItem.r5 .pickerGlyph{color:var(--r5)}
.pickerItem.r4 .pickerGlyph{color:var(--r4)}
.pickerItem.r3 .pickerGlyph{color:var(--r3)}
.pickerLevel{position:absolute;bottom:-4px;right:-4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 4px;font-size:8px;color:var(--muted);line-height:1.5;white-space:nowrap}
.pickerRolls{position:absolute;bottom:-4px;left:-4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 4px;font-size:8px;color:var(--accent);line-height:1.5;white-space:nowrap}
.pickerDetail{min-width:0;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:10px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-start;gap:3px}

.pickerDetail .artStatOn{font-size:10px}
.loadoutHint{margin-top:6px}
@media(max-width:760px){.pickerBody{grid-template-columns:1fr}}
.statHeadRow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.statGrade{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:15px;padding:0 3px;margin-left:4px;border-radius:4px;font-size:9px;font-weight:700;vertical-align:middle;letter-spacing:0}
.statGrade.s{background:#3a2f12;color:#fcd34d;border:1px solid #6b551d}
.statGrade.good{background:#12314f;color:#93c5fd;border:1px solid #35507d}
.statGrade.warn{background:#3a2f12;color:#fcd34d;border:1px solid #6b551d}
.statGrade.bad{background:#3b1717;color:#fca5a5;border:1px solid #6b2a2a}
.pcard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin:0 0 8px;overflow:hidden}
.pcard{min-width:0}
.pcard .phead{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,auto);grid-template-rows:auto auto;align-items:center;column-gap:8px;row-gap:2px;padding:5px 22px 5px 10px;height:58px;min-height:58px;box-sizing:border-box;cursor:pointer;list-style:none;position:relative;min-width:0}
.pcard .phead::-webkit-details-marker{display:none}
.pcard .phead::after{content:'▸';color:var(--muted);font-size:10px;position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.pcard[open] .phead::after{content:'▾'}
.pillph{width:38px;height:25px;flex:0 0 auto;grid-column:1;grid-row:1 / span 2}
.phead > .pill{grid-column:1;grid-row:1 / span 2;align-self:center}
.pname{grid-column:2;grid-row:1;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.palways{grid-column:3;grid-row:1;font-size:10px;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.pcond{grid-column:2;grid-row:2;font-size:10px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbody{height:110px;overflow:auto;overscroll-behavior:contain;padding:8px 10px 10px;border-top:1px solid var(--line)}
.pselect{width:100%;margin-bottom:6px;font-size:12px;padding:5px 6px}
.phead .pselect.inline{grid-column:3;grid-row:2;justify-self:end;width:auto;max-width:220px;height:24px;margin:0;padding:1px 6px;font-size:11px;min-width:0}
.scorebar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;width:180px;border:1px solid var(--line)}
.scorebar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 14px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;position:relative}
.stat:hover,.stat:focus{z-index:30}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.stathead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:6px;row-gap:2px;align-items:start}
.stathead .k{grid-column:1;grid-row:1}
.stathead .v{grid-column:1;grid-row:2}
.stathead .targets{grid-column:2;grid-row:1 / span 2;align-self:start}
.stat .targets{font-size:10px;color:var(--muted);text-align:right;line-height:1.3}
.stat-pop{position:fixed;left:var(--pop-left,0);top:var(--pop-top,0);z-index:35;width:min(280px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;box-shadow:0 18px 40px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top left;transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s;pointer-events:auto}
.stat-pop::before{content:'';position:absolute;left:0;right:0;top:-6px;height:6px}
.stat:hover .stat-pop,.stat:focus .stat-pop{opacity:1;visibility:visible;transform:translateY(0) scale(1);transition-delay:1s,1s,1s}
.stat .bd{font-size:10px;color:var(--muted);line-height:1.4}
.stat .bdsec{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:#7f8a99;margin-top:3px}
.stat .bdrow{display:flex;justify-content:space-between;gap:8px}
.stat .bdrow span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.good .v{color:var(--good)} .warn .v{color:var(--warn)} .bad .v{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.tablewrap th{position:sticky;top:0;background:var(--panel);z-index:1}
.tablewrap th.sortable{padding-right:17px;cursor:pointer;user-select:none}
.tablewrap th.sortable::after{content:'⇅';position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:9px;line-height:1;opacity:.4}
.tablewrap th.sortable:hover::after{opacity:.75}
.tablewrap th.sortable[data-dir="asc"]::after{content:'↑';opacity:1;color:var(--accent)}
.tablewrap th.sortable[data-dir="desc"]::after{content:'↓';opacity:1;color:var(--accent)}
.thShort{display:none}
tr:hover td{background:#1b2029}
.subs{font-size:11px;color:var(--muted);line-height:1.5}
.subs b{color:#cbd5e1;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px}
.v-KEEP{background:#12314f;color:#93c5fd}
.v-LEVEL{background:#2e1b4d;color:#d8b4fe}
.v-REVIEW{background:#3a2f12;color:#fcd34d}
.v-SALVAGE{background:#3b1717;color:#fca5a5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.btn:hover{background:var(--panel2)}
.btn.on{background:#233049;border-color:#35507d}
.btn.ghost{background:transparent}
.tablewrap{max-height:calc(100vh - 190px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px}
.tablewrap table{width:100%;min-width:0;table-layout:fixed}
.tablewrap th:nth-child(1){width:31%}
.tablewrap th:nth-child(2){width:21%}
.tablewrap th:nth-child(3){width:7%}
.tablewrap th:nth-child(4){width:10%}
.tablewrap th:nth-child(5){width:9%}
.tablewrap th:nth-child(6){width:13%}
.tablewrap th:nth-child(7){width:9%}
.tablewrap td,.tablewrap th{overflow-wrap:anywhere;word-break:break-word}
.talentCard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.talentSummary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;cursor:pointer;list-style:none}
.talentSummary::-webkit-details-marker{display:none}
.talentSummary::after{content:'▸';color:var(--muted);font-size:10px;flex:0 0 auto}
.talentCard[open] .talentSummary::after{content:'▾'}
.talentName{display:flex;flex-direction:column;gap:1px;min-width:0}
.talentName .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.talentLevels{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:10px;color:var(--muted);white-space:nowrap}
.talentLevels b{font-size:15px;color:var(--text)}
.talentDesc{padding:8px 10px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.talentModeled{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:12px 0;font-size:12px;color:var(--muted)}
.talentModeled b{color:var(--text)}
.conGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.conCard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px}
.conCard.locked{opacity:.55}
.conCard.unlocked{border-color:#35507d}
.conTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.conName{font-weight:600;font-size:13px}
.conBadge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.conCard.unlocked .conBadge{color:var(--good);border-color:var(--good)}
.conDesc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--muted)}
.pill.toggle{cursor:pointer;font:inherit;font-size:12px;padding:3px 10px;border-radius:999px}
.pill.toggle.on{background:#12314f;color:#93c5fd;border-color:#35507d}
.pill.toggle.off{background:#2a2f38;color:var(--muted)}
.upg{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:6px 0}
.upg b{color:var(--good)}
.help{max-width:900px;line-height:1.6}
.help h3{margin:20px 0 6px}
.help code{background:var(--panel2);padding:1px 5px;border-radius:4px}
.help ul{padding-left:20px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 18px}
.big .stat .v{font-size:26px}
@media(max-width:820px){
  .split{grid-template-columns:minmax(0,1fr);row-gap:14px;align-items:start}
  .leftcol{height:auto;min-height:0}

}

<header>

            </button>
            <div class="listmodeView" id="listModeView">
              <div class="modePane searchPane">
                <input id="charSearch" type="search" placeholder="Search character...">

            </div>

        <div class="subpane hide" id="talentPane"></div>

          <th class="sortable" data-sort="artifact">Artifact</th><th class="sortable" data-sort="bestfit">Best fit</th><th class="sortable" data-sort="fit">Fit</th><th class="sortable" data-sort="projected">At +20</th><th class="sortable" data-sort="potential" aria-label="Potential"><span class="thFull">Potential</span><span class="thShort">Pot.</span></th><th class="sortable" data-sort="usedby">Used by</th><th class="sortable" data-sort="verdict">Verdict</th>

    <div style="text-align:center;margin-top:10px"><button class="btn" id="moreBtn">Show more</button></div>

  <section id="tab-help" class="hide">
