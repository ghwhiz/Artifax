# GitHub Pages workflow for the shareable build.
# Publishes only index.html and icons/; account data is never deployed.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for account data
        run: |
          if grep -qE '"file":"[^"]' index.html; then
            echo "index.html still contains an account report. Run 'node report.js --site' and commit the new index.html."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r icons _site/icons

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
